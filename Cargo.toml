[package]
name = "acorn-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Harsh Mandan <harshsinghmandan@gmail.com>"]
description = "A function-for-function Rust port of the acorn JavaScript parser and @sveltejs/acorn-typescript, matching their syntax errors exactly"
repository = "https://github.com/harshmandan/acorn-rs"
readme = "README.md"
keywords = ["acorn", "javascript", "typescript", "parser", "svelte"]
categories = ["parser-implementations", "development-tools"]
# An allow-list, anchored to the package root: an unanchored "README.md"
# would also match inside the upstream/ submodules. Tests, the corpus,
# scripts and upstream/ stay out of the published crate. (An `exclude`
# beside `include` is ignored.)
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[package.metadata.ported-from]
# The sources this release follows, by commit. The test corpus in
# tests/corpus/versions.json is answered by exactly these.
acorn = { version = "8.19.0", commit = "0e0ece7cc7202624d4aca531be4b515b0114b5d0" }
"@sveltejs/acorn-typescript" = { version = "1.0.13", commit = "5e2e70417f655a70c592b55590ac24f9c995fb11" }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# The destructure-then-condition shape used throughout reads worse
# collapsed.
collapsible_if = "allow"
collapsible_match = "allow"

[dependencies]
stacker = "0.1"

[dev-dependencies]
serde_json = "1"

[lib]
doctest = false
